<div class="flex h-screen w-full align-items-center justify-content-center">
  <div class="surface-card p-4 shadow-2 border-round w-full lg:w-6">
    <div class="text-center mb-5">
      <img src="assets/images/electron-logo.png" alt="Image" height="50" class="mb-3">
      <div class="text-900 text-3xl font-medium mb-3">Ласкаво просимо</div>
      <span class="text-600 font-medium line-height-3">Немає акаунту?</span>
      <a class="font-medium no-underline ml-2 text-blue-500 cursor-pointer">Створити зараз!</a>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="email" class="block text-900 font-medium mb-2">Емейл</label>
      <input id="email" type="text" placeholder="Емейл адреса" pInputText class="w-full mb-3" formControlName="email">
<!--      <small class="p-error">Username is not available.</small>-->


      <label for="password" class="block text-900 font-medium mb-2">Пароль</label>
      <input id="password" type="password" placeholder="Пароль" pInputText class="w-full mb-3" formControlName="password">
<!--      <small class="p-error">Username is not available.</small>-->

      <div class="flex align-items-center justify-content-between mb-6">
        <div class="flex align-items-center">
        </div>
        <a class="font-medium no-underline ml-2 text-blue-500 text-right cursor-pointer">Забули пароль?</a>
      </div>

      <button pButton pRipple label="Увійти" icon="pi pi-user" class="w-full"></button>
    </form>
  </div>
</div>
